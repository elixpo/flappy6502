# ld65 config for flappy512: the whole program must fit in the top 512 bytes of the
# address space ($FE00-$FFFF, vectors included). If it grows past that, ld65 fails.
# The rest of the 8 KiB 28C64 image is filled with $FF.
MEMORY {
    PAD:  start = $E000, size = $1E00, fill = yes, fillval = $FF, file = %O;
    ROM:  start = $FE00, size = $01FA, fill = yes, fillval = $FF, file = %O;
    VEC:  start = $FFFA, size = $0006, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:    load = ROM, type = ro;
    VECTORS: load = VEC, type = ro;
}
