# ld65 config for flappy1k: the whole program must fit in the top 1 KiB of the
# address space ($FC00-$FFFF, vectors included). If it grows past that, ld65 fails.
# The rest of the 8 KiB 28C64 image is filled with $FF.
MEMORY {
    PAD:  start = $E000, size = $1C00, fill = yes, fillval = $FF, file = %O;
    ROM:  start = $FC00, size = $03FA, fill = yes, fillval = $FF, file = %O;
    VEC:  start = $FFFA, size = $0006, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:    load = ROM, type = ro;
    VECTORS: load = VEC, type = ro;
}
